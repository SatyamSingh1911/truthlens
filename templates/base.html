<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TruthLens{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ url_for('index') }}">TruthLens</a>
      <nav>
        <a href="{{ url_for('index') }}">Feed</a>
        <a href="{{ url_for('submit') }}">Submit a claim</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      TruthLens · Civic Tech & Misinformation Triage
    </div>
  </footer>

</body>
</html>
